spring.application.name=roadnet-backend
server.port=8080

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/roadnet
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
roadnet.jwt.secret=roadnet-dev-secret-key-change-me-in-production-0123456789abcdef0123456789abcdef
roadnet.jwt.expiration-ms=86400000

# --- CORS ---
roadnet.cors.allowed-origins=http://localhost:5173

# --- Logging ---
logging.level.org.hibernate.SQL=INFO
